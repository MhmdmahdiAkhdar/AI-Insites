    <main>
        <h1 id="cont">Contact Us</h1>
        <div class="dives">
            <img id="im1" src="../images/mail.svg">
            <p class="bim">202310795@ua.edu.lb<br>202312054@ua.edu.lb</p>
        </div>


        <div class="dives">
            <img id="im1" src="../images/call.svg">
            <p class="bim">+96181868134<br>+96171236166</p>
        </div>

        <div class="dives">
            <img id="im1" src="../images/location.svg">
            <p class="bim"><a id="location" target="_blank" href="https://maps.app.goo.gl/QjBVpXsCzjiJzng38">Antonine
                    University-Hadat/Baabda Campus</a>
            </p>
        </div>

        <form id="feedbackForm">
            <div class="btw">
                <div id="left">
                    <div class="fulemail">
                        <h3>Full Name<small> *</small></h3>
                        <input class="fullmail" type="text" id="name" placeholder="Ahmad Assaf" required>
                        <label for="name" aria-required=""></label>
                    </div>

                    <div class="fulemail">
                        <h3>Email<small> *</small></h3>
                        <input class="fullmail" type="email" id="email" placeholder="example@gmail.com" required>
                        <label for="name"></label>
                    </div>
                </div>

                <div id="right">
                    <h3 id="maincont">Feedback<small> *</small></h3>
                    <textarea id="inp1" name="inp1" placeholder="Tell us more about your experience... "
                        required></textarea>
                </div>
            </div>

            <div id="rating">
                <legend>Rate your experience with our website (optional)</legend>
                <select id="selectionn" required>
                    <option value="0">Select</option>
                    <option value="0" aria-required="">0%</option>
                    <option value="0">25%</option>
                    <option value="0">50%</option>
                    <option value="0">75%</option>
                    <option value="0">100%</option>
                </select>
            </div>


            <div class="submit-container">
                <input id="bot1" type="submit" value="Submit">
            </div>

        </form>

    </main>
